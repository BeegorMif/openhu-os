# Root slot A, read-only and compressed. Fixed size: slot B (created on the first boot, see
# /usr/lib/repart.d) gets the same size, an update image always fits.
[Partition]
Type=root
Label=openhu_%A
Format=erofs
# Split out as mkosi.output/openhu-os_<version>.root.raw: the update for the other slot (scripts/build.sh)
SplitName=root
Compression=lz4hc
CopyFiles=/
SizeMinBytes=3G
SizeMaxBytes=3G
