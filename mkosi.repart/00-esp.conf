# Built into the image. Room for two unified kernel images (A/B updates), each about 55 MB today.
[Partition]
Type=esp
Format=vfat
# Not part of an update (scripts/build.sh splits out the root partition only)
SplitName=-
# Boot loader and unified kernel images only, not Debian's vmlinuz/config/System.map (they are in the image anyway)
CopyFiles=/boot/EFI:/EFI
CopyFiles=/boot/loader:/loader
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
