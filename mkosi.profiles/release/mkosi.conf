# Image for real use: no login, no ssh, a failing boot reboots instead of waiting at an emergency shell.
# No console= here: Plymouth shows its splash on the console's VT and leaves the display there, the OpenHU session on
# tty1 would never become active (cage: "Timeout waiting session to become active"). quiet/loglevel=3 keep tty1 clean.
[Content]
KernelCommandLine=rd.emergency=reboot
