# dev profile (VMs): Ctrl+Alt+F2 switches to a text console. The hardware cursor plane of QEMU's virtio GPU draws
# the pointer about 64 px too low, so clicks seem to land above it: cage draws the cursor itself.
[Service]
Environment=WLR_NO_HARDWARE_CURSORS=1
ExecStart=
ExecStart=/usr/bin/cage -d -s -- /usr/libexec/openhu-os/session-client /usr/bin/autoapp
