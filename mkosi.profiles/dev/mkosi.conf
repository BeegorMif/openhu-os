# Development image for the VM: ssh (scripts/ssh.sh), root password "openhu", serial console, debugging tools,
# VT switching in cage (Ctrl+Alt+F2 for a console), root shell without a login on the consoles (VTs, serial;
# mkosi.extra/usr/lib/systemd/system/*getty@.service.d). Never ship this profile.
# ffmpeg and sox: simulated RTL-SDR stick of the radio plugin (internet streams as FM stations with RDS,
# openhu-plugins#5).
# login: agetty starts it on the consoles; trixie has it no longer as an essential package, without it the
# consoles had no login at all ("can't exec /bin/login").
[Content]
Packages=login
         less
         vim-tiny
         strace
         curl
         usbutils
         pciutils
         procps
         iputils-ping
         htop
         libinput-tools
         wayland-utils
         alsa-utils
         mesa-utils-bin
         grim
         ffmpeg
         sox
RootPassword=openhu
# plymouth.ignore-serial-consoles: graphical splash although the serial console is the main console
KernelCommandLine=console=ttyS0,115200n8
                  plymouth.ignore-serial-consoles
# ssh keys of the developer, written by scripts/build.sh
ExtraTrees=%D/local/dev-extra
