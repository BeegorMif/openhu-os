# OpenHU OS: Debian trixie, boots straight into OpenHU (cage kiosk). Build with scripts/build.sh.
[Config]
MinimumVersion=25

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
ImageId=openhu-os
Format=disk
OutputDirectory=mkosi.output
ManifestFormat=json
# The root partition as its own file (update image), see mkosi.repart/10-root.conf
SplitArtifacts=uki,partitions

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
# EFI/Linux/openhu-os_<version>.efi: systemd-boot sorts by version (newest first), openhu-update adds the next one
# with boot counting (openhu-os_<version>+3.efi)
UnifiedKernelImageFormat=%i_%v
WithDocs=no
WithRecommends=no
Locale=C.UTF-8
# Keyboard layout of the image: /etc/vconsole.conf for the text consoles (openhu-console-keymap.service). The
# kiosk's layout is XKB_DEFAULT_LAYOUT in openhu-session.service: change both together.
Keymap=de
Hostname=openhu
# Read-only root: the slot of this version (a UKI always boots its own root, A/B updates). No boot messages or
# cursor over the UI; fsck repairs instead of dropping to an emergency shell; no audit log (only noise here).
# No systemd-networkd in the initrd: nothing there needs a network, and its state file in /run ("offline")
# outlived the switch to the system, so systemd-timesyncd never synchronized (NetworkManager runs the network).
KernelCommandLine=ro
                  root=PARTLABEL=openhu_%v
                  rootfstype=erofs
                  quiet
                  splash
                  loglevel=3
                  systemd.show_status=false
                  rd.systemd.show_status=false
                  rd.udev.log_level=3
                  vt.global_cursor_default=0
                  fsck.repair=yes
                  audit=0
                  rd.systemd.mask=systemd-networkd.service
                  rd.systemd.mask=systemd-networkd.socket

[Build]
Incremental=yes
