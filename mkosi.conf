# OpenHU OS: Debian trixie, boots straight into OpenHU (cage kiosk). Build with scripts/build.sh.
[Config]
MinimumVersion=25

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
ImageId=openhu-os
Format=disk
OutputDirectory=mkosi.output
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
WithDocs=no
WithRecommends=no
Locale=C.UTF-8
Keymap=de
Timezone=Europe/Berlin
Hostname=openhu
# No boot messages or cursor over the UI; fsck repairs instead of dropping to an emergency shell
KernelCommandLine=rw
                  quiet
                  loglevel=3
                  systemd.show_status=false
                  rd.systemd.show_status=false
                  rd.udev.log_level=3
                  vt.global_cursor_default=0
                  fsck.repair=yes

[Build]
Incremental=yes
