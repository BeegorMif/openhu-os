# NetworkManager's dnsmasq of the "shared" networks (Ethernet DHCP server #15, the hotspot): answers ".local" itself
# (no such name) instead of asking the uplink. nss-mdns on a device first asks unicast DNS for "local" and waits 5 s
# per try when there is no answer (an uplink that refuses it, as QEMU's does), before it resolves openhu.local by mDNS.
local=/local/
