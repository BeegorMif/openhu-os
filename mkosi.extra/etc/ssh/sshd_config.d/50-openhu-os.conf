# ssh is off until it is switched on in OpenHU (openhu-ssh enable), as root with the password set there
# (openhu-ssh password, /var/lib/openhu-os/ssh/passwd via pam_pwdfile) or a key in
# /var/lib/openhu-os/ssh/authorized_keys.
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
AuthorizedKeysFile .ssh/authorized_keys /var/lib/openhu-os/ssh/authorized_keys
# Host keys of this device (/usr/libexec/openhu-os/ssh-hostkeys)
HostKey /var/lib/openhu-os/ssh/ssh_host_ed25519_key
HostKey /var/lib/openhu-os/ssh/ssh_host_rsa_key
