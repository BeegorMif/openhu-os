# Replaces Debian's /usr/lib/tmpfiles.d/debian.conf: /etc is read-only, its links are made when the image is built.
# Without "L+ /etc/vconsole.conf": mkosi writes the keymap there, Debian's link to /etc/default/keyboard (from
# console-setup, not installed) fails on every boot.
L /run/shm     -    -    -    -   /dev/shm
d /run/sendsigs.omit.d 0755 root root -
d /run/lock    1777 root root -   -

L /etc/mtab    -    -    -    -  ../proc/self/mounts
L /etc/default/locale - - -  -  ../locale.conf
