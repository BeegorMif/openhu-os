# A root shell on the text consoles (Ctrl+Alt+F2 ...) without a login, in dev and release images (#20): whoever has
# a keyboard at the head unit has physical access anyway and may use the distribution underneath. Network logins
# (ssh) still need the password or a key, PAM of sshd is untouched (agetty starts "login -f root" itself, only on the
# local console). tty1 belongs to the OpenHU session.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noreset --noclear - ${TERM}
