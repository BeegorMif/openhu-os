# ssh only when switched on (openhu-ssh enable); the dev image has the developer key built in and always runs it.
[Unit]
ConditionPathExists=|/var/lib/openhu-os/ssh/enabled
ConditionPathExists=|/root/.ssh/authorized_keys

[Service]
ExecStartPre=
ExecStartPre=/usr/libexec/openhu-os/ssh-hostkeys
ExecStartPre=/usr/sbin/sshd -t
