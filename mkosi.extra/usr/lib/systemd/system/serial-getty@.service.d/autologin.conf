# A root shell on the serial console without a login, like the text consoles (getty@.service.d/autologin.conf).
# Release images have no console= on the kernel command line, so a serial getty only runs where the hardware's
# own console is serial; the dev image uses ttyS0 (VM).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noreset --noclear --keep-baud 115200,57600,38400,9600 - ${TERM}
