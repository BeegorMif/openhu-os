# /etc is read-only: connections (hotspot, WiFi) on the data partition, resolv.conf in /run
# (/etc/resolv.conf links there, see mkosi.postinst.chroot)
[main]
rc-manager=symlink
# no automatic "Wired connection 1": the profile openhu-ethernet takes every Ethernet port (#15)
no-auto-default=*

[keyfile]
path=/var/lib/NetworkManager/system-connections
