# Home of the openhu user: openhu.ini (working directory) and ~/.openhu (plugins, logs)
d /var/lib/openhu 0750 openhu openhu -
# Lingering: the user manager with PipeWire runs from boot and survives restarts of the session
f /var/lib/systemd/linger/openhu 0644 root root -
# /var is an empty partition on the first boot (and hides what the image had there): state directories
d /var/lib/NetworkManager 0700 root root -
d /var/lib/NetworkManager/system-connections 0700 root root -
d /var/lib/bluetooth 0700 root root -
d /var/lib/polkit-1 0700 polkitd polkitd -
