[Match]
Architecture=arm64

# Raspberry Pi 4 and 5: mkosi builds the directory tree, then rpi/assemble.sh
# creates a disk with one firmware-readable FAT partition and one read-only root.
# The Pi image is single-slot; updates are disabled to prevent overwriting its
# only root partition.
[Output]
Output=openhu-os-rpi_%v
Format=directory
SplitArtifacts=

[Content]
Bootloader=none
UnifiedKernelImages=no
Packages=linux-image-rpi-v8
         linux-image-rpi-2712
         raspi-firmware
         firmware-brcm80211
         bluez-firmware
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
                           /vc4.ko
                           /hid.ko
ExtraTrees=%D/rpi/extra
RemoveFiles=/usr/lib/repart.d/11-root-b.conf

[Build]
SandboxTrees=%D/rpi/sandbox
