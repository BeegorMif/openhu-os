# Radio plugin (org.openhu.radio) with an RTL-SDR stick: FM/AM (rtl_fm, rtl_power from rtl-sdr; sox for the RDS
# audio path). DAB+ (openhu-dab) and RDS (redsea) come with the plugin archive (built for Debian trixie, one per
# architecture); their shared libraries come from here:
#   openhu-dab: librtlsdr0 libfaad2 libfftw3-single3 libsamplerate0
#   redsea:     libliquid1 libsndfile1
# (openhu-plugins: plugins/org.openhu.radio/README.md, manifest "packages")
[Content]
Packages=rtl-sdr
         sox
         librtlsdr0
         libfaad2
         libfftw3-single3
         libsamplerate0
         libliquid1
         libsndfile1
