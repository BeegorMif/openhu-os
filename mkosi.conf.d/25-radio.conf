# Radio plugin (org.openhu.radio) with an RTL-SDR stick: FM/AM (rtl_fm, rtl_power from rtl-sdr; sox for RDS audio)
# and DAB+ (welle-cli from welle.io, mpg123 decodes its MP3 stream). redsea (RDS decoding) is not packaged in Debian.
# welle.io also ships the Qt5 GUI welle-io: about 98 MB and 47 packages more on the image, welle-cli itself needs
# no Qt.
[Content]
Packages=rtl-sdr
         sox
         mpg123
         welle.io
