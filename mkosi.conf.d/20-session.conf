# Kiosk session: cage (Wayland) with OpenHU, Mesa, PipeWire. The Qt/QML runtime of openhu is listed here so it is
# part of the cached base and only the openhu package changes between builds.
[Content]
Packages=cage
         qt6-wayland
         libgl1-mesa-dri
         libegl-mesa0
         fonts-dejavu-core
         xkb-data
         pipewire
         pipewire-pulse
         wireplumber
         libspa-0.2-bluetooth
         pulseaudio-utils
         dbus-user-session
         python3
         python3-websockets
         qml6-module-qtquick
         qml6-module-qtquick-window
         qml6-module-qtquick-layouts
         qml6-module-qtquick-controls
         qml6-module-qtmultimedia
         qt6-svg-plugins
         libqt6websockets6
         plymouth
# Boot splash already in the initrd; the theme package (scripts/build.sh) is volatile like openhu
InitrdPackages=plymouth
InitrdVolatilePackages=openhu-os-splash
