[Match]
Architecture=arm64

[Content]
Packages=linux-image-arm64
         firmware-brcm80211
# Initrd modules needed to reach a root filesystem on SD/USB and to bring up a Pi 4 under its UEFI ACPI tables.
# The generic Debian arm64 kernel supplies the BCM2711, USB, SDHCI, Wi-Fi and DRM drivers; brcmfmac needs the
# non-free firmware package above. Keep the initrd small while explicitly carrying removable-storage and input
# modules needed before the read-only root is mounted.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
                           /hid.ko
                           /usbhid.ko
                           /xhci_hcd.ko
                           /xhci_pci.ko
                           /usb_storage.ko
                           /uas.ko
                           /sdhci.ko
                           /sdhci_iproc.ko
                           /mmc_core.ko
                           /mmc_block.ko
