# Base system: systemd, boot, network (NetworkManager, also for the wireless Android Auto hotspot), Bluetooth.
# dnsmasq-base: NetworkManager's "shared" mode of the hotspot needs it. fdisk: sfdisk relabels the root slots
# (openhu-update). ssh: off until switched on in OpenHU (openhu-ssh, pkexec), root password via pam_pwdfile.
# login: agetty starts it on the consoles (root shell without a login, getty@.service.d); trixie has it no longer as
# an essential package, without it the consoles had no login at all ("can't exec /bin/login").
# nftables: NetworkManager's "shared" mode adds its rules with nft, and openhu-ethernet-firewall keeps the devices on
# the Ethernet port from being forwarded (#15). avahi-daemon, libnss-mdns: the head unit is openhu.local.
[Content]
Packages=systemd
         login
         systemd-sysv
         udev
         dbus
         libpam-systemd
         systemd-timesyncd
         systemd-boot
         systemd-boot-efi
         kmod
         systemd-repart
         fdisk
         e2fsprogs
         ca-certificates
         tzdata
         iproute2
         polkitd
         network-manager
         wpasupplicant
         dnsmasq-base
         nftables
         avahi-daemon
         libnss-mdns
         iw
         wireless-regdb
         bluez
         openssh-server
         openssh-sftp-server
         libpam-pwdfile
         pkexec
         bash-completion
