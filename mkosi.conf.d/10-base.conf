# Base system: systemd, boot, network (NetworkManager, also for the wireless Android Auto hotspot), Bluetooth.
# dnsmasq-base: NetworkManager's "shared" mode of the hotspot needs it.
[Content]
Packages=systemd
         systemd-sysv
         udev
         dbus
         libpam-systemd
         systemd-timesyncd
         systemd-boot
         systemd-boot-efi
         kmod
         e2fsprogs
         ca-certificates
         tzdata
         iproute2
         polkitd
         network-manager
         wpasupplicant
         dnsmasq-base
         iw
         wireless-regdb
         bluez
